name: Update README stats

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh stats
        run: node scripts/update-stats.js

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "dsmans-bot"
            git config user.email "dsmans-bot@users.noreply.github.com"
            git add README.md
            git commit -m "chore: refresh live stats"
            git push
          else
            echo "no changes"
          fi